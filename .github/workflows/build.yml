name: Build The Collider Plugin

on:
  push:
    branches: [ "claude/collider-synth-plugin-kTeW9" ]
  pull_request:
    branches: [ "claude/collider-synth-plugin-kTeW9" ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake

    - name: Clone JUCE
      run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

    - name: Create clean build directory
      run: |
        rm -rf build CMakeCache.txt CMakeFiles
        mkdir -p build

    - name: Configure CMake with Xcode generator
      working-directory: ./build
      run: cmake .. -G Xcode -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_FORCED:BOOL=ON

    - name: Build VST3
      working-directory: ./build
      run: xcodebuild -project TheCollider.xcodeproj -scheme TheCollider_VST3 -configuration Release -jobs 4 GCC_TREAT_WARNINGS_AS_ERRORS=NO CLANG_WARN_CPP_ERROR_DIRECTIVE=NO 2>&1 | tail -50

    - name: Find and package artifacts
      run: |
        mkdir -p release-artifacts

        echo "=== Checking what was built ==="
        ls -laR build/TheCollider_artefacts/ 2>/dev/null | head -50

        echo ""
        echo "=== Looking for VST3 bundle ==="
        find build -name "*.vst3" -type d -exec ls -lhR {} \; 2>/dev/null | head -30

        echo ""
        echo "=== Copying VST3 if found ==="
        if [ -d "build/TheCollider_artefacts/Release/VST3/TheCollider.vst3" ]; then
          echo "Found VST3 bundle, checking contents..."
          du -sh "build/TheCollider_artefacts/Release/VST3/TheCollider.vst3"
          ls -la "build/TheCollider_artefacts/Release/VST3/TheCollider.vst3/"

          cp -r "build/TheCollider_artefacts/Release/VST3/TheCollider.vst3" release-artifacts/
          echo "✅ VST3 copied to artifacts"
          du -sh release-artifacts/TheCollider.vst3
        else
          echo "❌ VST3 not found in expected location"
          find . -name "TheCollider.vst3" -type d 2>/dev/null
        fi

        echo ""
        echo "=== Final artifacts ==="
        ls -lhR release-artifacts/

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TheCollider-macOS
        path: release-artifacts/*
        retention-days: 30

  create-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/claude/')
    steps:
    - uses: actions/download-artifact@v4

    - name: List artifacts
      run: |
        ls -la
        find . -name "*.vst3" -o -name "*.component" 2>/dev/null | head -20

